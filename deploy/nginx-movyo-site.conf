server {
  listen 80;
  server_name movyo.delivery www.movyo.delivery;

  return 301 https://movyo.delivery$request_uri;
}

server {
  listen 443 ssl http2;
  server_name movyo.delivery www.movyo.delivery;

  ssl_certificate /etc/letsencrypt/live/movyo.delivery/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/movyo.delivery/privkey.pem;

  root /var/www/movyo-landingpage/dist;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location /downloads/ {
    alias /var/www/downloads/;
    autoindex off;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|webp|gif|svg|ico|mp4|woff|woff2|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  access_log /var/log/nginx/movyo.access.log;
  error_log /var/log/nginx/movyo.error.log;
}
